              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
  /api/visits/{id}/complete/:
    post:
      operationId: visits_complete_create
      description: Complete the visit; it stays in the patient's history (VISIT-007/008).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this visit.
        required: true
      tags:
      - visits
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
          description: ''
  /api/visits/{id}/follow-ups/:
    post:
      operationId: visits_follow_ups_create
      description: Book a follow-up appointment with the same doctor (VISIT-006).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
