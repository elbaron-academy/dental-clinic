components:
  schemas:
    AmountDueRequest:
      type: object
      properties:
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount_due
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          allOf:
          - $ref: '#/components/schemas/PatientSummary'
          readOnly: true
        doctor:
          allOf:
          - $ref: '#/components/schemas/DoctorSummary'
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        notes:
          type: string
        follow_up_of:
          type: integer
          readOnly: true
          nullable: true
          description: The visit in which the doctor requested this follow-up.
        visit_id:
          type: integer
          nullable: true
          readOnly: true
        billing:
          allOf:
          - $ref: '#/components/schemas/Billing'
          nullable: true
          readOnly: true
          description: Present only for users with the payments.view_payment permission.
        checked_in_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - billing
      - cancelled_at
      - checked_in_at
      - created_at
      - doctor
      - follow_up_of
      - id
      - patient
      - scheduled_at
      - status
      - status_display
      - visit_id
    AppointmentRequest:
      type: object
      properties:
        patient_id:
          type: integer
          writeOnly: true
        doctor_id:
          type: integer
          writeOnly: true
          description: Optional when the user has exactly one permitted doctor.
        scheduled_at:
          type: string
          format: date-time
        notes:
          type: string
      required:
      - patient_id
      - scheduled_at
    AppointmentStatusEnum:
      enum:
      - SCHEDULED
      - CHECKED_IN
      - IN_VISIT
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `CHECKED_IN` - Waiting for doctor
        * `IN_VISIT` - In visit
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    Balance:
      type: object
      description: Totals over the patient's non-cancelled appointments (PAY-003,
        PAY-007).
      properties:
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        appointments_pending:
          type: integer
        appointments_not_set:
          type: integer
      required:
      - amount_due
      - amount_paid
      - appointments_not_set
      - appointments_pending
      - remaining_amount
    Billing:
      type: object
      description: Billing summary of one appointment.
      properties:
        amount_due:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        remaining_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        payment_status_display:
          type: string
      required:
      - amount_due
      - amount_paid
      - payment_status
      - payment_status_display
      - remaining_amount
    BlankEnum:
      enum:
      - ''
    ClinicSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        doctor_count:
          type: integer
          readOnly: true
      required:
      - doctor_count
      - id
      - name
    DoctorSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
      required:
      - full_name
      - id
    DoctorSummaryRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - full_name
    FollowUp:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        scheduled_at:
          type: string
          format: date-time
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
      required:
      - id
      - scheduled_at
      - status
      - status_display
    FollowUpRequest:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
        notes:
          type: string
      required:
      - scheduled_at
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            Role of the login page. When sent, accounts of another role are refused.

            * `DOCTOR` - Doctor
            * `ASSISTANT` - Assistant
            * `RECEPTIONIST` - Receptionist
      required:
      - password
      - phone
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - token
      - user
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          title: Phone number
          description: Used to log in. Spaces and dashes are removed automatically.
          maxLength: 16
        full_name:
          type: string
          maxLength: 150
        role:
          description: |-
            Clinic role. Leave empty only for platform administrators.

            * `DOCTOR` - Doctor
            * `ASSISTANT` - Assistant
            * `RECEPTIONIST` - Receptionist
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        role_display:
          type: string
          readOnly: true
        clinic:
          allOf:
          - $ref: '#/components/schemas/ClinicSummary'
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        permitted_doctors:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - clinic
      - full_name
      - id
      - permissions
      - permitted_doctors
      - phone
      - role_display
    Medication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        details:
          type: string
          description: Optional strength/form, e.g. 500 mg capsule.
          maxLength: 200
      required:
      - id
      - name
    MedicationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        details:
          type: string
          description: Optional strength/form, e.g. 500 mg capsule.
          maxLength: 200
      required:
      - name
