openapi: 3.0.3
info:
  title: Dental Clinic API
  version: 1.0.0
  description: 'API contract for the Dental Clinic MVP. Authenticate with `POST /api/auth/login/`
    and send `Authorization: Token <token>`.'
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD in the server time zone.
      - in: query
        name: doctor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: patient
        schema:
          type: integer
      - in: query
        name: scheduled_from
        schema:
          type: string
        description: ISO date-time, inclusive.
      - in: query
        name: scheduled_to
        schema:
          type: string
        description: ISO date-time, exclusive.
      - in: query
        name: search
        schema:
          type: string
        description: Patient name or phone.
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses.
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_create
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: appointments_update
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: appointments_partial_update
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/amount-due/:
    post:
      operationId: appointments_amount_due_create
      description: Record the amount due; allowed before or after the session (PAY-001,
        PAY-004).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountDueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AmountDueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AmountDueRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/cancel/:
    post:
      operationId: appointments_cancel_create
      description: Appointments, check-in, queue and visit start (APPT-001..006).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/check-in/:
    post:
      operationId: appointments_check_in_create
      description: Mark the patient as arrived; they now wait for the doctor (APPT-002).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/start-visit/:
    post:
      operationId: appointments_start_visit_create
      description: Start the active visit. Fails with 409 if the patient is already
        in one (APPT-005).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this appointment.
        required: true
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/queue/:
    get:
      operationId: appointments_queue_retrieve
      description: Patients waiting for each doctor and the visits in progress (APPT-003).
      parameters:
      - in: query
        name: doctor
        schema:
          type: integer
        description: Limit to one doctor.
      tags:
      - appointments
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Phone number + password login for every role (AUTH-001).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revokes the token used for the request.
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The signed-in user, their clinic, permissions and permitted doctors
        (AUTH-002).
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/catalog/medications/:
    get:
      operationId: catalog_medications_list
      description: Active medications available to the user's clinic.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - catalog
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
          description: ''
  /api/catalog/medications/{id}/:
    get:
      operationId: catalog_medications_retrieve
      description: Active medications available to the user's clinic.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this medication.
        required: true
      tags:
      - catalog
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
          description: ''
  /api/catalog/procedures/:
    get:
      operationId: catalog_procedures_list
      description: Active procedures available to the user's clinic.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
