# Security headers for the Web/PWA (installed by web/deploy/deploy.sh).
# Included in every location, because nginx drops server-level add_header
# directives inside a location that sets its own headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Browsers ignore this over plain HTTP; it takes effect once certbot enables HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
