name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push run: it may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # SQLite only for now: no PostgreSQL service and no QA job (product owner, 2026-09-27).
  backend:
    name: Backend (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=true python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing:skip-covered
      - name: API contract has not drifted (docs/api/openapi.yaml)
        run: |
          export DJANGO_DEBUG=true DATABASE_URL=sqlite:////tmp/schema.sqlite3
          python manage.py migrate -v0
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml

  web:
    name: Web/PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Continuous deployment: a push to the deploy branch that passes CI goes live.
  # The key can only run "deploy <sha>" on the VM (scripts/ci-deploy-forced-command.sh).
  deploy:
    name: Deploy to production
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/adoring-goldberg-ye6g4m'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dental.hossam-ameen.online
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: >-
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes
          -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
          "$DEPLOY_TARGET" "deploy $GITHUB_SHA"
      - name: Check the live sites
        run: |
          curl -fsS https://api.dental.hossam-ameen.online/api/health/
          curl -fsS -o /dev/null https://dental.hossam-ameen.online/
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # QA suites (qa/api, qa/e2e) are not run in CI for now (product owner, 2026-09-27).
  # Flutter runtime testing is disabled for the MVP (skills/flutter/SKILL.md).
