name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # SQLite only for now: no PostgreSQL service and no QA job (product owner, 2026-09-27).
  backend:
    name: Backend (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=true python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing:skip-covered
      - name: API contract has not drifted (docs/api/openapi.yaml)
        run: |
          export DJANGO_DEBUG=true DATABASE_URL=sqlite:////tmp/schema.sqlite3
          python manage.py migrate -v0
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml

  web:
    name: Web/PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # QA suites (qa/api, qa/e2e) are not run in CI for now (product owner, 2026-09-27).
  # Flutter runtime testing is disabled for the MVP (skills/flutter/SKILL.md).
