name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dental
          POSTGRES_PASSWORD: dental
          POSTGRES_DB: dental_clinic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dental"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://dental:dental@localhost:5432/dental_clinic' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_DEBUG=true python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing:skip-covered
      - name: API contract has not drifted (docs/api/openapi.yaml)
        if: matrix.database == 'sqlite'
        run: |
          export DJANGO_DEBUG=true DATABASE_URL=sqlite:////tmp/schema.sqlite3
          python manage.py migrate -v0
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u ../docs/api/openapi.yaml /tmp/openapi.yaml

  web:
    name: Web/PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  qa:
    name: QA (API acceptance + Web/PWA e2e)
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            qa/package-lock.json
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          npm ci --prefix web
          npm ci --prefix qa
          cd qa && npx playwright install --with-deps chromium
      - name: API acceptance tests
        working-directory: qa
        run: ../backend/.venv/bin/pytest
      - name: Web and PWA end-to-end tests
        working-directory: qa
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: qa/playwright-report
  # Flutter runtime testing is disabled for the MVP (skills/flutter/SKILL.md).
